name: อัปเดตข้อมูลการลงทุนรายวัน

# เวลาใน cron เป็น UTC เสมอ (ไทย = UTC+7)
on:
  schedule:
    # 11:00 UTC = 18:00 น. ไทย — หลังตลาดหุ้นไทยปิด (16:30 น.)
    - cron: '0 11 * * 1-5'
    # 22:30 UTC = 05:30 น. ไทยของวันถัดไป — หลังตลาดสหรัฐฯ ปิด
    - cron: '30 22 * * 1-5'
  workflow_dispatch:          # กดรันเองได้จากหน้า Actions

# ต้องมีสิทธิ์เขียนเพื่อ commit ไฟล์ข้อมูลกลับเข้า repo
permissions:
  contents: write

# ถ้ารอบก่อนยังไม่เสร็จ ให้รอจนจบ ไม่รันซ้อนกัน (กัน commit ชนกัน)
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ดึงโค้ดจาก repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: ติดตั้ง dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow

      - name: กู้ cache ราคาจากรอบก่อน
        # ถ้า yfinance ล่ม pipeline จะใช้ cache นี้แทนแล้วทำเครื่องหมายว่าข้อมูลเก่า
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: รัน pipeline วิเคราะห์
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/main.py

      - name: ตรวจว่าไฟล์ผลลัพธ์ถูกต้องก่อน commit
        # กันกรณี pipeline เขียนไฟล์เสียหรือว่างเปล่าแล้ว push ทับของดี
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          path = Path("data-private/dashboard.json")
          if not path.exists():
              sys.exit("ไม่พบ dashboard.json")

          data = json.loads(path.read_text(encoding="utf-8"))
          assets = data.get("all_assets", [])
          if len(assets) < 50:
              sys.exit(f"มีสินทรัพย์แค่ {len(assets)} ตัว — น้อยผิดปกติ ไม่ commit")
          if not data.get("horizons"):
              sys.exit("ไม่มีผลจัดอันดับตามระยะ — ไม่ commit")
          print(f"ตรวจผ่าน: {len(assets)} สินทรัพย์")
          PY

      - name: commit และ push ข้อมูลใหม่
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-private
          if git diff --staged --quiet; then
            echo "ข้อมูลไม่เปลี่ยนแปลง ไม่ต้อง commit"
          else
            git commit -m "ข้อมูลตลาดอัตโนมัติ $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
