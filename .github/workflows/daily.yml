name: อัปเดตข้อมูลการลงทุนรายวัน

# เวลาใน cron เป็น UTC เสมอ (ไทย = UTC+7)
# ⚠ ลดจากวันละ 2 ครั้งเหลือสัปดาห์ละครั้ง — ชั่วคราว ไม่ใช่การออกแบบที่ต้องการ
#
# เหตุผล: Netlify คิดเงินแบบเครดิต (บัญชีที่เปิดหลัง 4 ก.ย. 2025 ทุกบัญชี)
# แผนฟรี = 300 เครดิต/เดือน และ **production deploy กิน 15 เครดิตต่อครั้ง**
# ทุกครั้งที่ workflow นี้ commit ข้อมูล Netlify จะ build ใหม่ = 15 เครดิต
#   วันละ 2 ครั้ง × 21.7 วันทำการ = 43 deploy = 652 เครดิต = เกินโควตา 2.2 เท่า
# เมื่อเครดิตหมด Netlify **พักเว็บทั้งเว็บ** ผู้เข้าเห็นหน้า "Site not available"
#
# สัปดาห์ละครั้ง = 4 deploy/เดือน = 60 เครดิต ซึ่งอยู่ในงบ
# ราคาระหว่างสัปดาห์ผู้ใช้กดปุ่ม "อัปเดตราคาตลาดเดี๋ยวนี้" ได้เอง (ฟรี ไม่ deploy)
# ส่วนคะแนนและอันดับคำนวณจากโมเมนตัมหลายเดือนกับงบการเงิน จึงไม่เปลี่ยนรายวันอยู่แล้ว
#
# **วิธีแก้ที่ถูกต้องคือย้ายข้อมูลไปเก็บใน Netlify Blobs แทนการ commit เข้า repo**
# แล้วข้อมูลจะอัปเดตได้ทุกวันโดยไม่ต้อง build เว็บใหม่เลย → กลับมาใช้ cron รายวันได้
# (ดู Saved.md หัวข้อ "ทำต่อจากตรงนี้")
on:
  schedule:
    # 01:00 UTC เสาร์ = 08:00 น. เสาร์ไทย — หลังตลาดทั้งไทยและสหรัฐฯ ปิดสัปดาห์
    - cron: '0 1 * * 6'
  workflow_dispatch:          # กดรันเองได้จากหน้า Actions

# ต้องมีสิทธิ์เขียนเพื่อ commit ไฟล์ข้อมูลกลับเข้า repo
permissions:
  contents: write

# ถ้ารอบก่อนยังไม่เสร็จ ให้รอจนจบ ไม่รันซ้อนกัน (กัน commit ชนกัน)
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ดึงโค้ดจาก repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: ติดตั้ง dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow

      - name: กู้ cache ราคาจากรอบก่อน
        # ถ้า yfinance ล่ม pipeline จะใช้ cache นี้แทนแล้วทำเครื่องหมายว่าข้อมูลเก่า
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: รัน pipeline วิเคราะห์
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/main.py

      - name: ตรวจว่าไฟล์ผลลัพธ์ถูกต้องก่อน commit
        # กันกรณี pipeline เขียนไฟล์เสียหรือว่างเปล่าแล้ว push ทับของดี
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          path = Path("data-private/dashboard.json")
          if not path.exists():
              sys.exit("ไม่พบ dashboard.json")

          data = json.loads(path.read_text(encoding="utf-8"))
          assets = data.get("all_assets", [])
          if len(assets) < 50:
              sys.exit(f"มีสินทรัพย์แค่ {len(assets)} ตัว — น้อยผิดปกติ ไม่ commit")
          if not data.get("horizons"):
              sys.exit("ไม่มีผลจัดอันดับตามระยะ — ไม่ commit")

          sector_path = Path("data-private/sectors.json")
          if not sector_path.exists():
              sys.exit("ไม่พบ sectors.json")
          groups = json.loads(sector_path.read_text(encoding="utf-8")).get("groups", [])
          if len(groups) < 5:
              sys.exit(f"จัดกลุ่มอุตสาหกรรมได้แค่ {len(groups)} กลุ่ม — น้อยผิดปกติ ไม่ commit")

          # บทวิเคราะห์ของ AI ขาดได้โดยไม่ถือว่าล้มเหลว — เขียนใหม่เดือนละครั้งเท่านั้น
          # และหน้าเว็บแสดงตัวเลขของกลุ่มได้อยู่แล้วแม้ยังไม่มีบทความ
          written = sum(1 for g in groups if g.get("ai"))
          print(f"ตรวจผ่าน: {len(assets)} สินทรัพย์ · {len(groups)} กลุ่ม "
                f"(มีบทวิเคราะห์ {written} กลุ่ม)")
          PY

      - name: commit และ push ข้อมูลใหม่
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-private
          if git diff --staged --quiet; then
            echo "ข้อมูลไม่เปลี่ยนแปลง ไม่ต้อง commit"
          else
            git commit -m "ข้อมูลตลาดอัตโนมัติ $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
